name: Xenon Performance v1.9.0 optimizer core

on:
  push:
    branches: [main, xenon-performance-stage-b-auto-mode, recovery/stage-b1-failure-rollback]
    paths:
      - 'src/xp_optimizer.c'
      - 'src/xp_optimizer.h'
      - 'tests/test_optimizer.c'
      - '.github/workflows/optimizer-core-v190.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/xp_optimizer.c'
      - 'src/xp_optimizer.h'
      - 'tests/test_optimizer.c'
      - '.github/workflows/optimizer-core-v190.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xenon-performance-v190-optimizer-core
  cancel-in-progress: true

jobs:
  validate:
    name: Validate read-only optimization planner
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Build optimizer core
        run: |
          set -euo pipefail
          mkdir -p build
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
             src/xp_optimizer.c tests/test_optimizer.c \
             -o build/xp_optimizer_tests

      - name: Run optimizer policy tests
        run: |
          set -euo pipefail
          ./build/xp_optimizer_tests | tee build/XPOPT2.txt
          grep -F 'XPOPT2 PASS' build/XPOPT2.txt

      - name: Prove write gate remains closed
        run: |
          set -euo pipefail
          grep -F 'p.hardware_writes_enabled = false;' src/xp_optimizer.c
          ! grep -R -E 'MmSetAddressProtect|MmDoubleMapMemory|HalWriteArgonEeprom|memcpy\s*\(' src/xp_optimizer.c src/xp_optimizer.h
          echo 'XPWRITEGATE1 PASS: no Xbox memory/SMC/NAND write primitive in optimizer core'

      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.9.0-Optimizer-Core-Validation
          retention-days: 14
          path: build/XPOPT2.txt
